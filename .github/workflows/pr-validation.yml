name: PR validation
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Benign baseline artifact
        run: |
          echo "baseline report" > linter-report.txt
          echo "1" > pr-number.txt
      - name: Upload linter report
        uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
